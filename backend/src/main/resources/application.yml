server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

spring:
  application:
    name: milktea-bar
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:milktea_bar}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:admin}
    password: ${MYSQL_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        # 悲观行锁等待上限（秒）：并发争用后到事务快速失败而不是长时间挂起
        jakarta:
          persistence:
            lock:
              timeout: 5000
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    # 金额普通数字序列化（WRITE_BIGDECIMAL_AS_PLAIN）由 JacksonConfig 统一开启，
    # 保证配方售价/订单合计输出 12.00 / 24.00，而不是 1E+1 科学计数法。
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
